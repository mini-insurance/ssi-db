<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少額短期保険DB</title>
<style>
  :root { --bg: #f8f9fa; --card: #fff; --text: #1a1a2e; --accent: #2563eb; --border: #e5e7eb; --muted: #6b7280; --hover: #f1f5f9; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

  .header { background: linear-gradient(135deg, #1e3a5f, #2563eb); color: #fff; padding: 20px 32px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 12px; opacity: .8; margin-top: 2px; }

  .container { max-width: 1600px; margin: 0 auto; padding: 20px; }

  /* Controls */
  .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .controls label { font-size: 12px; color: var(--muted); }
  .controls select, .controls input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .controls input[type="text"] { min-width: 240px; }
  .year-tabs { display: flex; gap: 4px; }
  .year-tab { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; }
  .year-tab:hover { border-color: var(--accent); }
  .year-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* View toggle */
  .view-tabs { display: flex; gap: 4px; }
  .view-tab { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; }
  .view-tab:hover { border-color: var(--accent); }
  .view-tab.active { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }

  /* Table */
  .table-wrap { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; max-height: 80vh; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; white-space: nowrap; }
  th { position: sticky; top: 0; background: #f8fafc; text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border);
       font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; cursor: pointer; user-select: none; z-index: 10; }
  th:hover { color: var(--accent); }
  th .sort-icon { margin-left: 4px; font-size: 10px; opacity: .4; }
  th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:hover { background: var(--hover); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .negative { color: #dc2626; }
  .na { color: #d1d5db; }
  .company-name { font-weight: 500; min-width: 200px; white-space: normal; line-height: 1.6; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 3px; margin-top: 2px; vertical-align: middle; }
  .badge-kasai { background: #fef3c7; color: #92400e; }
  .badge-tenpo { background: #ffedd5; color: #9a3412; }
  .badge-seimei { background: #dbeafe; color: #1e40af; }
  .badge-iryo { background: #e0f2fe; color: #075985; }
  .badge-kaigo { background: #cffafe; color: #155e75; }
  .badge-pet { background: #fce7f3; color: #9d174d; }
  .badge-sharyo { background: #e2e8f0; color: #475569; }
  .badge-hiyo { background: #f0fdf4; color: #166534; }
  .badge-baisho { background: #faf5ff; color: #6b21a8; }
  .badge-shogai { background: #f5f3ff; color: #5b21b6; }
  .badge-shotoku { background: #ecfdf5; color: #065f46; }
  .badge-default { background: #f1f5f9; color: #475569; }

  /* Detail panel */
  .detail-panel { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 20px; margin-top: 16px; display: none; }
  .detail-panel.open { display: block; }
  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .detail-header h2 { font-size: 16px; }
  .detail-close { cursor: pointer; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .detail-table { width: 100%; }
  .detail-table th { position: static; background: transparent; font-size: 12px; padding: 6px 8px; }
  .detail-table td { padding: 6px 8px; font-size: 13px; white-space: normal; }
  .detail-section { margin-bottom: 8px; }
  .detail-section h3 { font-size: 13px; font-weight: 600; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

  .count { font-size: 12px; color: var(--muted); }

  /* Show more button */
  .show-more { text-align: center; padding: 12px; }
  .show-more button { padding: 8px 24px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; color: var(--accent); }
  .show-more button:hover { background: var(--hover); }

  /* Product filter */
  .line-filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .line-filter { padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 11px; }
  .line-filter:hover { border-color: var(--accent); }
  .line-filter.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Edit mode */
  .edit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .edit-table th { position: sticky; top: 0; background: #f0f4f8; padding: 6px 8px; border: 1px solid var(--border); font-size: 11px; z-index: 1; }
  .edit-table td { padding: 4px 6px; border: 1px solid var(--border); }
  .edit-table td.editable { background: #fff; }
  .edit-table td.missing { background: #fef9c3; }
  .edit-table td input { width: 100%; border: none; background: transparent; font-size: 12px; padding: 2px; text-align: right; outline: none; }
  .edit-table td input:focus { background: #eff6ff; }
  .edit-table td.readonly { background: #f8f9fa; color: var(--muted); }
  .edit-toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .edit-toolbar button { padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; }
  .edit-toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .edit-toolbar .edit-status { font-size: 12px; color: var(--muted); }

  /* News */
  .news-list { display: flex; flex-direction: column; gap: 12px; }
  .news-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; transition: box-shadow .15s; }
  .news-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .news-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 11px; color: var(--muted); }
  .news-date { font-weight: 600; }
  .news-cat { padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .news-cat-ma { background: #fce7f3; color: #9d174d; }
  .news-cat-product { background: #d1fae5; color: #065f46; }
  .news-cat-regulation { background: #fee2e2; color: #991b1b; }
  .news-cat-industry { background: #dbeafe; color: #1e40af; }
  .news-cat-earnings { background: #fef3c7; color: #92400e; }
  .news-cat-other { background: #f1f5f9; color: #475569; }
  .news-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .news-title a { color: var(--text); text-decoration: none; }
  .news-title a:hover { color: var(--accent); }
  .news-summary { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .news-companies { margin-top: 6px; }
  .news-company-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; background: #f1f5f9; color: var(--accent); margin-right: 4px; cursor: pointer; }
  .news-company-tag:hover { background: #dbeafe; }
  .news-toolbar { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .news-filter-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 12px; font-weight: 500; }
  .news-filter-btn:hover { border-color: var(--accent); }
  .news-filter-btn.active { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .news-updated { font-size: 11px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>

<div class="header">
  <h1>少短DB</h1>
  <p id="header-desc">少額短期保険業界の財務・商品データベース</p>
</div>

<div class="container">
  <!-- 第一階層: タブ -->
  <div class="controls">
    <div class="view-tabs">
      <div class="view-tab active" data-view="overview" onclick="setView('overview')">一覧</div>
      <div class="view-tab" data-view="news" onclick="setView('news')">ニュース</div>
    </div>
  </div>

  <!-- 一覧ビュー -->
  <div id="table-view">
    <div class="controls">
      <div>
        <label>検索</label><br>
        <input type="text" id="search" placeholder="会社名・グループ名・商品種目で絞り込み" oninput="render()">
      </div>
      <div>
        <label>商品種目</label><br>
        <div class="line-filters" id="line-filters"></div>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="show-more" id="show-more" style="display:none">
      <button onclick="toggleShowAll()"><span id="show-more-text">全社表示</span></button>
    </div>
    <div class="table-wrap">
      <table id="main-table"></table>
    </div>
  </div>

  <!-- ニュースビュー -->
  <div id="news-view" style="display:none">
    <div class="controls">
      <div class="news-filter-btn active" data-cat="all" onclick="setNewsCat(this)">すべて</div>
      <div class="news-filter-btn" data-cat="業界動向" onclick="setNewsCat(this)">業界動向</div>
      <div class="news-filter-btn" data-cat="新商品" onclick="setNewsCat(this)">新商品</div>
      <div class="news-filter-btn" data-cat="M&A" onclick="setNewsCat(this)">M&A</div>
      <div class="news-filter-btn" data-cat="規制" onclick="setNewsCat(this)">規制</div>
      <div class="news-filter-btn" data-cat="決算" onclick="setNewsCat(this)">決算</div>
      <span class="news-updated" id="news-updated"></span>
    </div>
    <div class="news-list" id="news-list"></div>
  </div>

  <!-- Edit view -->
  <div id="edit-view" style="display:none">
    <div class="edit-toolbar">
      <select id="edit-year" onchange="currentYear=this.value;renderEdit()" style="padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px">
        <option value="2024">2024年度</option>
        <option value="2023">2023年度</option>
        <option value="2022">2022年度</option>
      </select>
      <select id="edit-filter" onchange="renderEdit()" style="padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px">
        <option value="missing">歯抜けのみ</option>
        <option value="all">全社</option>
      </select>
      <span class="edit-status" id="edit-status"></span>
      <div style="flex:1"></div>
      <button onclick="applyEdits()" class="primary" style="background:#059669;border-color:#059669">変更を反映</button>
      <button onclick="exportJSON()">JSON保存</button>
      <button onclick="exportCSV()">CSV出力</button>
    </div>
    <div style="margin-bottom:8px;display:flex;gap:12px;font-size:11px;align-items:center">
      <span><span style="display:inline-block;width:12px;height:12px;background:#d1fae5;border:1px solid #ccc;border-radius:2px;vertical-align:middle"></span> データあり</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#fef9c3;border:1px solid #ccc;border-radius:2px;vertical-align:middle"></span> 歯抜け（入力可能）</span>
    </div>
    <div class="table-wrap" style="max-height:75vh;overflow:auto">
      <table id="edit-table" class="edit-table"></table>
    </div>
  </div>


  <div class="detail-panel" id="detail">
    <div class="detail-header">
      <h2 id="detail-name"></h2>
      <button class="detail-close" onclick="closeDetail()">閉じる</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<script>
let DATA = [];
let currentYear = '2024';
let currentView = 'overview';
let sortCol = null;
let sortAsc = true;
let showAll = false;
let activeLineFilter = null;
const INITIAL_SHOW = 10;

// Column definitions per view
const VIEWS = {
  overview: [
    { key: '_rank', label: '#', type: 'rank' },
    { key: 'name', label: '会社名', type: 'name' },
    { key: '元受正味保険料.合計', label: '元受正味保険料', type: 'oku' },
    { key: '正味収入保険料.合計', label: '正味収入保険料', type: 'oku' },
    { key: '保有契約件数', label: '保有契約件数', type: 'int' },
    { key: '経常利益', label: '経常利益', type: 'hyaku' },
    { key: '元受合算率.合計', label: '元受合算率', type: 'pct' },
    { key: 'ソルベンシーマージン比率', label: 'ソルベンシー', type: 'pct' },
    { key: '従業員数', label: '従業員数', type: 'emp' },
    { key: 'founded', label: '設立', type: 'founded' },
  ],
  premium: [
    { key: '_rank', label: '#', type: 'rank' },
    { key: 'name', label: '会社名', type: 'name' },
    { key: '元受正味保険料.合計', label: '元受(合計)', type: 'oku' },
    { key: '元受正味保険料.火災', label: '元受(火災)', type: 'oku' },
    { key: '元受正味保険料.生命', label: '元受(生命)', type: 'oku' },
    { key: '元受正味保険料.その他', label: '元受(その他)', type: 'oku' },
    { key: '正味収入保険料.合計', label: '正味(合計)', type: 'oku' },
    { key: '正味収入保険料.火災', label: '正味(火災)', type: 'oku' },
    { key: '正味収入保険料.生命', label: '正味(生命)', type: 'oku' },
    { key: '正味収入保険料.その他', label: '正味(その他)', type: 'oku' },
    { key: '保有契約件数', label: '保有契約件数', type: 'int' },
  ],
  pnl: [
    { key: '_rank', label: '#', type: 'rank' },
    { key: 'name', label: '会社名', type: 'name' },
    { key: '経常収益', label: '経常収益', type: 'hyaku' },
    { key: '保険引受利益', label: '保険引受利益', type: 'hyaku' },
    { key: '経常利益', label: '経常利益', type: 'hyaku' },
    { key: '当期純利益', label: '当期純利益', type: 'hyaku' },
    { key: '元受正味保険料.合計', label: '元受保険料', type: 'oku' },
  ],
  ratio: [
    { key: '_rank', label: '#', type: 'rank' },
    { key: 'name', label: '会社名', type: 'name' },
    { key: '元受損害率.合計', label: '元受損害率(計)', type: 'pct' },
    { key: '元受損害率.火災', label: '損害率(火災)', type: 'pct' },
    { key: '元受損害率.生命', label: '損害率(生命)', type: 'pct' },
    { key: '元受損害率.その他', label: '損害率(他)', type: 'pct' },
    { key: '元受事業費率.合計', label: '元受事業費率(計)', type: 'pct' },
    { key: '元受事業費率.火災', label: '事業費率(火災)', type: 'pct' },
    { key: '元受事業費率.生命', label: '事業費率(生命)', type: 'pct' },
    { key: '元受事業費率.その他', label: '事業費率(他)', type: 'pct' },
    { key: '元受合算率.合計', label: '元受合算率(計)', type: 'pct' },
    { key: '元受合算率.火災', label: '合算率(火災)', type: 'pct' },
    { key: '元受合算率.生命', label: '合算率(生命)', type: 'pct' },
    { key: '元受合算率.その他', label: '合算率(他)', type: 'pct' },
  ],
  bs: [
    { key: '_rank', label: '#', type: 'rank' },
    { key: 'name', label: '会社名', type: 'name' },
    { key: '資本金', label: '資本金', type: 'hyaku' },
    { key: '純資産額', label: '純資産額', type: 'hyaku' },
    { key: '総資産額', label: '総資産額', type: 'hyaku' },
    { key: '責任準備金残高', label: '責任準備金', type: 'hyaku' },
    { key: 'ソルベンシーマージン比率', label: 'ソルベンシー', type: 'pct' },
    { key: '従業員数', label: '従業員数', type: 'emp' },
  ],
};

// Helpers
function getVal(yearData, key) {
  if (!yearData) return null;
  const parts = key.split('.');
  let v = yearData;
  for (const p of parts) { if (v == null) return null; v = v[p]; }
  return v;
}

function fmt(v, type) {
  if (v == null) return '<span class="na">—</span>';
  switch(type) {
    case 'oku': { const o = Math.round(v / 10000) / 10; return (o < 0 ? '<span class="negative">' + o.toLocaleString('ja-JP',{maximumFractionDigits:1}) + '億</span>' : o.toLocaleString('ja-JP',{maximumFractionDigits:1}) + '億'); }
    case 'hyaku': { const h = Math.round(v / 100) / 10; return (h < 0 ? '<span class="negative">' + h.toLocaleString('ja-JP',{maximumFractionDigits:1}) + '百万</span>' : h.toLocaleString('ja-JP',{maximumFractionDigits:1}) + '百万'); }
    case 'int': return v.toLocaleString('ja-JP');
    case 'pct': return (v < 0 ? '<span class="negative">' + v.toFixed(1) + '%</span>' : v.toFixed(1) + '%');
    case 'emp': return v + '名';
    case 'founded': return v || '<span class="na">—</span>';
    default: return v;
  }
}

function rawVal(co, key) {
  if (key === '_rank') return 0;
  if (key === 'name') return co.name;
  if (key === 'founded') return co.founded || null;
  const yd = co.years[currentYear];
  return getVal(yd, key);
}

// Year
function setYear(y) {
  currentYear = y;
  document.querySelectorAll('.year-tab').forEach(t => t.classList.toggle('active', t.textContent === y));
  sortCol = null;
  render();
}

// View
function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  sortCol = null;
  document.getElementById('table-view').style.display = 'none';
  document.getElementById('edit-view').style.display = 'none';
  document.getElementById('news-view').style.display = 'none';
  document.getElementById('detail').classList.remove('open');
  if (v === 'edit') {
    document.getElementById('edit-view').style.display = '';
    document.getElementById('edit-year').value = currentYear;
    renderEdit();
  } else if (v === 'news') {
    document.getElementById('news-view').style.display = '';
    renderNews();
  } else {
    document.getElementById('table-view').style.display = '';
    render();
  }
}

let newsFilter = 'all';
function setNewsCat(el) {
  newsFilter = el.dataset.cat;
  document.querySelectorAll('.news-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === newsFilter));
  renderNews();
}

// Sort
function doSort(colKey) {
  if (sortCol === colKey) { sortAsc = !sortAsc; }
  else { sortCol = colKey; sortAsc = colKey === 'name' ? true : false; } // default desc for numbers
  render();
}

// Toggle show all
function toggleShowAll() {
  showAll = !showAll;
  render();
}

// Line filter
function setLineFilter(line) {
  activeLineFilter = activeLineFilter === line ? null : line;
  document.querySelectorAll('.line-filter').forEach(f => f.classList.toggle('active', f.dataset.line === activeLineFilter));
  showAll = true; // show all when filtering
  render();
}

// Build line filter buttons
function buildLineFilters() {
  const allLines = new Set();
  DATA.forEach(co => (co.main_lines||[]).forEach(l => allLines.add(l)));
  const el = document.getElementById('line-filters');
  el.innerHTML = [...allLines].sort().map(l =>
    `<div class="line-filter" data-line="${l}" onclick="setLineFilter('${l}')">${l}</div>`
  ).join('');
}

// Render
function render() {
  const cols = VIEWS[currentView];
  if (!cols) return;
  const query = document.getElementById('search').value.toLowerCase();

  // Filter
  let rows = DATA.filter(co => {
    // Text search: company name, group, category, AND product lines/names
    if (query) {
      const texts = [co.name, co.group||'', co.category||'', ...(co.main_lines||[]), ...(co.products||[]).map(p=>(p.name||'')+(p.line||''))].join(' ').toLowerCase();
      if (!texts.includes(query)) return false;
    }
    // Line filter
    if (activeLineFilter) {
      if (!(co.main_lines||[]).includes(activeLineFilter)) return false;
    }
    return true;
  });

  // Sort
  if (sortCol) {
    rows.sort((a, b) => {
      let va = rawVal(a, sortCol);
      let vb = rawVal(b, sortCol);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === 'string') return sortAsc ? va.localeCompare(vb, 'ja') : vb.localeCompare(va, 'ja');
      return sortAsc ? va - vb : vb - va;
    });
  } else {
    // Default: sort by 元受正味保険料 desc
    rows.sort((a, b) => {
      const va = getVal(a.years[currentYear], '元受正味保険料.合計') || 0;
      const vb = getVal(b.years[currentYear], '元受正味保険料.合計') || 0;
      return vb - va;
    });
  }

  // Build table
  let html = '<thead><tr>';
  cols.forEach(col => {
    const isSorted = sortCol === col.key;
    const icon = isSorted ? (sortAsc ? '▲' : '▼') : '▲▼';
    const cls = isSorted ? 'sorted' : '';
    if (col.type === 'rank') {
      html += `<th style="width:40px;cursor:default">#</th>`;
    } else {
      html += `<th class="${cls}" onclick="doSort('${col.key}')">${col.label} <span class="sort-icon">${icon}</span></th>`;
    }
  });
  html += '</tr></thead><tbody>';

  // Totals row at top (uses ALL filtered rows)
  const sumKeys = {
    '元受正味保険料.合計': 'oku',
    '正味収入保険料.合計': 'oku',
    '保有契約件数': 'int',
    '経常利益': 'hyaku',
  };
  const sums = {};
  Object.keys(sumKeys).forEach(k => sums[k] = 0);
  rows.forEach(co => {
    const yd = co.years[currentYear] || {};
    Object.keys(sumKeys).forEach(k => {
      const v = getVal(yd, k);
      if (v != null) sums[k] += v;
    });
  });
  html += '<tr style="background:#eef2ff;font-weight:700;border-bottom:2px solid var(--accent)">';
  cols.forEach(col => {
    if (col.type === 'rank') { html += '<td></td>'; }
    else if (col.type === 'name') { html += `<td>合計（${rows.length}社）</td>`; }
    else if (sumKeys[col.key]) { html += `<td class="num">${fmt(sums[col.key], sumKeys[col.key])}</td>`; }
    else { html += '<td></td>'; }
  });
  html += '</tr>';

  const totalRows = rows.length;
  const displayRows = (showAll || query || activeLineFilter) ? rows : rows.slice(0, INITIAL_SHOW);

  displayRows.forEach((co, i) => {
    const yd = co.years[currentYear] || {};
    html += `<tr style="cursor:pointer" onclick="showDetail('${co.id}')">`;
    cols.forEach(col => {
      if (col.type === 'rank') {
        html += `<td>${i + 1}</td>`;
      } else if (col.type === 'name') {
        const miniBadges = (co.main_lines || []).map(l => {
          const badgeMap = {'家財':'badge-kasai','店舗':'badge-tenpo','生命':'badge-seimei','医療':'badge-iryo','介護':'badge-kaigo','ペット':'badge-pet','車両':'badge-sharyo','費用':'badge-hiyo','賠償責任':'badge-baisho','傷害':'badge-shogai'};
          const cls = badgeMap[l] || 'badge-default';
          return '<span class="badge ' + cls + '" style="padding:1px 5px;font-size:10px;vertical-align:baseline">' + l + '</span>';
        }).join('');
        const statusTag = co.status ? `<br><span style="font-size:9px;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:3px;padding:0 4px">${co.status}</span>` : '';
        const shortName = co.name.replace(/少額短期保険/g, '少短');
        html += `<td class="company-name">${shortName} ${miniBadges}${statusTag}</td>`;
      } else if (col.type === 'founded') {
        html += `<td style="font-size:12px">${fmt(co.founded, 'founded')}</td>`;
      } else {
        const v = getVal(yd, col.key);
        html += `<td class="num">${fmt(v, col.type)}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody>';

  document.getElementById('main-table').innerHTML = html;
  document.getElementById('count').textContent = rows.length + '社 / ' + DATA.length + '社';
  document.getElementById('header-desc').textContent = DATA.length + '社の財務・商品データベース';

  // Show more button
  const showMoreEl = document.getElementById('show-more');
  const hiddenCount = totalRows - displayRows.length;
  if (hiddenCount > 0 && !showAll && !query && !activeLineFilter) {
    showMoreEl.style.display = '';
    document.getElementById('show-more-text').textContent = `全社表示（残り${hiddenCount}社）`;
  } else if (showAll && !query && !activeLineFilter && totalRows > INITIAL_SHOW) {
    showMoreEl.style.display = '';
    document.getElementById('show-more-text').textContent = '折りたたむ';
  } else {
    showMoreEl.style.display = 'none';
  }
}

  { key: '正味収入保険料.合計', label: '正味収入保険料(千円)', type: 'number' },

  { key: '従業員数', label: '従業員数', type: 'number' },
];

function setVal(yearData, key, value) {
  const parts = key.split('.');
  if (parts.length === 1) {
    yearData[parts[0]] = value;
  } else {
    if (!yearData[parts[0]] || typeof yearData[parts[0]] !== 'object') yearData[parts[0]] = {};
    yearData[parts[0]][parts[1]] = value;
  }
}

function renderEdit() {
  const year = currentYear;
  const filter = document.getElementById('edit-filter').value;
  const query = document.getElementById('search').value.toLowerCase();

  // Filter companies
  let rows = DATA.map((co, ci) => ({ co, ci })).filter(({ co }) => {
    if (query && !co.name.toLowerCase().includes(query)) return false;
    if (filter === 'missing') {
      const yd = co.years[year];
      if (!yd) return true;
      return EDIT_FIELDS.some(f => getVal(yd, f.key) == null);
    }
    return true;
  });

  // Sort: most gaps first
  rows.sort((a, b) => {
    const ag = EDIT_FIELDS.filter(f => getVal((a.co.years[year]||{}), f.key) == null).length;
    const bg = EDIT_FIELDS.filter(f => getVal((b.co.years[year]||{}), f.key) == null).length;
    return bg - ag;
  });

  let html = '<thead><tr><th style="position:sticky;left:0;z-index:2;min-width:180px;background:#f0f4f8">会社名</th><th style="width:36px">欠損</th>';
  EDIT_FIELDS.forEach(f => html += `<th>${f.label}</th>`);
  html += '</tr></thead><tbody>';

  rows.forEach(({ co, ci }) => {
    if (!co.years[year]) co.years[year] = {};
    const yd = co.years[year];
    const gapCount = EDIT_FIELDS.filter(f => getVal(yd, f.key) == null).length;
    html += `<tr><td style="position:sticky;left:0;background:#f8fafc;z-index:1;font-weight:500;font-size:12px;white-space:normal;line-height:1.4">${co.name}</td>`;
    html += `<td style="text-align:center;font-size:11px;font-weight:600;${gapCount > 0 ? 'color:#dc2626' : 'color:#059669'}">${gapCount > 0 ? gapCount : '✓'}</td>`;
    EDIT_FIELDS.forEach(f => {
      const v = getVal(yd, f.key);
      const isMissing = v == null || v === '';
      const cls = isMissing ? 'editable missing' : 'editable';
      html += `<td class="${cls}"><input type="number" step="any" value="${v != null ? v : ''}" onchange="onEditChange(${ci},'${f.key}',this.value)" onfocus="this.parentElement.classList.add('editing')" onblur="this.parentElement.classList.remove('editing')" placeholder="${isMissing ? '—' : ''}"></td>`;
    });
    html += '</tr>';
  });
  html += '</tbody>';

  document.getElementById('edit-table').innerHTML = html;

  // Count missing
  let totalMissing = 0, totalCells = 0;
  DATA.forEach(co => {
    const yd = co.years[year] || {};
    EDIT_FIELDS.forEach(f => { totalCells++; if (getVal(yd, f.key) == null) totalMissing++; });
  });
  const pct = ((totalCells - totalMissing) / totalCells * 100).toFixed(1);
  document.getElementById('edit-status').textContent = `${year}年度 | 表示: ${rows.length}社 | 充足: ${pct}% | 歯抜け: ${totalMissing}件`;
}

function onEditChange(coIdx, key, value) {
  const co = DATA[coIdx];
  if (!co.years[currentYear]) co.years[currentYear] = {};
  const numVal = value === '' ? null : Number(value);
  setVal(co.years[currentYear], key, numVal);

  // Update cell highlight
  const table = document.getElementById('edit-table');
  const row = table.rows[coIdx + 1];
  const colIdx = EDIT_FIELDS.findIndex(f => f.key === key) + 1;
  const cell = row.cells[colIdx];
  cell.classList.toggle('missing', numVal == null);

  // Update missing count
  let missing = 0;
  DATA.forEach(c => {
    const yd = c.years[currentYear] || {};
    EDIT_FIELDS.forEach(f => { if (getVal(yd, f.key) == null) missing++; });
  });
  document.getElementById('edit-status').textContent = `${currentYear}年度 ・ 未入力: ${missing}件（黄色セル）`;
}

// ===== NEWS VIEW =====
let NEWS = [];

let NEWS_LAST_FETCHED = '';

async function loadNews() {
  try {
    const res = await fetch('./news.json');
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data)) { NEWS = data; } else { NEWS_LAST_FETCHED = data.lastFetched || ''; NEWS = data.items || []; }
    }
  } catch(e) {}
}

function renderNews() {
  const filter = newsFilter;
  const items = filter === 'all' ? NEWS : NEWS.filter(n => n.category === filter);

  const catCls = { 'M&A': 'news-cat-ma', '新商品': 'news-cat-product', '規制': 'news-cat-regulation', '業界動向': 'news-cat-industry', '決算': 'news-cat-earnings' };

  let html = '';
  if (items.length === 0) {
    html = '<p style="text-align:center;color:var(--muted);padding:40px">ニュースがありません</p>';
  } else {
    items.forEach(n => {
      const cls = catCls[n.category] || 'news-cat-other';
      const companies = (n.companies || []).map(c =>
        `<span class="news-company-tag" onclick="document.getElementById('search').value='${c.replace(/'/g,"\\'")}';setView('overview')">${c.replace(/少額短期保険/g,'少短')}</span>`
      ).join('');
      const titleLink = n.url ? `<a href="${n.url}" target="_blank">${n.title}</a>` : n.title;
      html += `<div class="news-item">
        <div class="news-meta">
          <span class="news-date">${n.date}</span>
          <span class="news-cat ${cls}">${n.category}</span>
          <span>${n.source || ''}</span>
        </div>
        <div class="news-title">${titleLink}</div>
        <div class="news-summary">${n.summary || ''}</div>
        ${companies ? '<div class="news-companies">' + companies + '</div>' : ''}
      </div>`;
    });
  }

  document.getElementById('news-list').innerHTML = html;
  const today = new Date().toISOString().slice(0, 10);
  const latestPast = NEWS.find(n => n.date <= today);
  const latestNews = latestPast ? latestPast.date : (NEWS.length > 0 ? NEWS[0].date : '');
  let statusText = items.length + '件';
  if (NEWS_LAST_FETCHED) statusText += ' | 最終取得: ' + NEWS_LAST_FETCHED;
  if (latestNews) statusText += ' | 最新ニュース: ' + latestNews;
  document.getElementById('news-updated').textContent = statusText;
}

function applyEdits() {
  // Update inline-data so changes persist when saving the HTML file
  const el = document.getElementById('inline-data');
  if (el) el.textContent = JSON.stringify(DATA);
  // Re-render current view to reflect changes
  renderEdit();
  alert('反映しました。他のタブに切り替えるとデータが反映されています。\\nHTMLファイルをCtrl+Sで保存すると永続化されます。');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'companies.json';
  a.click();
}

function exportCSV() {
  const year = currentYear;
  let csv = '\ufeff会社名,' + EDIT_FIELDS.map(f => f.label).join(',') + '\n';
  DATA.forEach(co => {
    const yd = co.years[year] || {};
    csv += co.name + ',' + EDIT_FIELDS.map(f => {
      const v = getVal(yd, f.key);
      return v != null ? v : '';
    }).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `少短DB_${year}.csv`;
  a.click();
}

// Init
async function loadData() {
  try {
    const res = await fetch('./companies.json');
    if (res.ok) { DATA = await res.json(); }
    else throw new Error();
  } catch(e) {
    const el = document.getElementById('inline-data');
    if (el) DATA = JSON.parse(el.textContent);
  }
  await loadNews();
  buildLineFilters();
  render();
}
loadData();
</script>
