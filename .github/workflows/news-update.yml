name: ニュース自動更新

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = JST 07:00（メイン）
    - cron: '30 0 * * *'   # UTC 00:30 = JST 09:30（バックアップ）
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ニュース取得
        run: node scripts/fetch-news.mjs
        timeout-minutes: 5

      - name: 変更があればコミット＆push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && echo "更新なし" && exit 0
          git commit -m "ニュース自動更新: $(date +%Y-%m-%d)"
          git push
